---
name: Load Secrets from 1Password
description: Load secrets from 1Password and export them as environment variables

inputs:
  op-connect-host:
    description: 1Password Connect Host
    required: true
  op-connect-token:
    description: 1Password Connect Token
    required: true

runs:
  using: composite
  steps:
    - name: Configure 1Password Connect
      uses: 1password/load-secrets-action/configure@92467eb28f72e8255933372f1e0707c567ce2259 # v4.0.0
      with:
        connect-host: ${{ inputs.op-connect-host }}
        connect-token: ${{ inputs.op-connect-token }}

    - name: Load secrets
      uses: 1password/load-secrets-action@92467eb28f72e8255933372f1e0707c567ce2259 # v4.0.0
      with: {export-env: true}
      env:
        # For state
        AWS_ACCESS_KEY_ID: op://cloud-terraform/Backblaze B2 State/username
        AWS_SECRET_ACCESS_KEY: op://cloud-terraform/Backblaze B2 State/password

        # For B2 API
        B2_APPLICATION_KEY_ID: op://cloud-terraform/Backblaze Master Key/username
        B2_APPLICATION_KEY: op://cloud-terraform/Backblaze Master Key/password

        # For Migadu API
        MIGADU_USERNAME: op://cloud-terraform/Migadu API Key/username
        MIGADU_TOKEN: op://cloud-terraform/Migadu API Key/password

        # For Cloudflare API
        CLOUDFLARE_API_TOKEN: op://cloud-terraform/Cloudflare API Key/password
        CLOUDFLARE_ACCOUNT_ID: op://cloud-terraform/Cloudflare API Key/username
        CLOUDFLARE_EMAIL: op://cloud-terraform/Cloudflare Zone ID/email
